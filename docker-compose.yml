services:
  verifact-api:
    image: verifact:latest
    container_name: verifact-api
    restart: unless-stopped
    ports:
      - "5020:8000"
    networks:
      - coolify
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/verifact.db
      - RECEIPT_TIME_TOLERANCE_MINUTES=30
      - DEBUG=false
    volumes:
      - verifact_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.http-0-verifact.entryPoints=http"
      - "traefik.http.routers.http-0-verifact.middlewares=redirect-to-https"
      - "traefik.http.routers.http-0-verifact.rule=Host(`verifact.jhojan.cloud`) && PathPrefix(`/`)"
      - "traefik.http.routers.http-0-verifact.service=http-0-verifact"
      - "traefik.http.routers.https-0-verifact.entryPoints=https"
      - "traefik.http.routers.https-0-verifact.middlewares=gzip"
      - "traefik.http.routers.https-0-verifact.rule=Host(`verifact.jhojan.cloud`) && PathPrefix(`/`)"
      - "traefik.http.routers.https-0-verifact.service=https-0-verifact"
      - "traefik.http.routers.https-0-verifact.tls=true"
      - "traefik.http.routers.https-0-verifact.tls.certresolver=letsencrypt"
      - "traefik.http.services.http-0-verifact.loadbalancer.server.port=8000"
      - "traefik.http.services.https-0-verifact.loadbalancer.server.port=8000"

networks:
  coolify:
    external: true

volumes:
  verifact_data:
    driver: local
