[project]
name = "verifact"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jhojan Personal", email = "jhojanjimene@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "pyzbar>=0.1.9",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
verifact = "verifact:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
